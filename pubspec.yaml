name: kiko_local
description: "KikoLocal - KikoFlu 像素级复刻的本地播放安卓音乐播放器"
publish_to: 'none'

version: 1.6.7+37

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 主题动态取色（PRD §11.1 沿用清单）
  dynamic_color: ^1.7.0

  # 状态管理（沿用 KikoFlu provider 方案）
  provider: ^6.1.2

  # 播放内核（沿用 KikoFlu 组合：just_audio + audio_service + audio_session）
  just_audio: ^0.10.6
  video_player: ^2.9.2
  audio_service: ^0.18.17
  audio_session: ^0.2.2

  # 存储
  shared_preferences: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.4
  sqflite: ^2.4.0

  # 权限（PRD §7：存储访问；低版本回退 READ_EXTERNAL_STORAGE）
  permission_handler: ^12.0.0

  # 封面墙瀑布流（KikoFlu 沿用清单）
  flutter_staggered_grid_view: ^0.7.0

  # 音频元数据（时长/内嵌封面提取，纯 Dart）
  audio_metadata_reader: ^1.7.1
  charset: ^2.0.1
  html: ^0.15.4
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  cached_network_image: ^3.4.1
  media_kit: ^1.2.6
  media_kit_libs_android_audio: ^1.3.8
  # 本地 fork：补 setAndroidAudioAttributes 空实现（media_kit 后端 + audio_service 组合修复）
  just_audio_media_kit:
    path: third_party/just_audio_media_kit
  flutter_overlay_window: ^0.5.0
  connectivity_plus: ^7.3.1
  # just_audio_media_kit_orig: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
  assets:
    - assets/demo/
